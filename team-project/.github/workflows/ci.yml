name: CI

# 课程实验三要求：分支保护 + 自动化构建与测试
on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------- 后端
  backend:
    name: 后端（编译 + 单元测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-project
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译
        run: mvn -B -q compile

      # 联网环境下直接跑 JUnit（本地离线环境请改用 SelfTestRunner，见 README §5）
      - name: 单元测试
        run: mvn -B test

      - name: 测试报告归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: team-project/target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 启动与接口契约
  integration:
    name: 启动服务 + 接口契约自检
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: team-project
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 编译并生成运行时 classpath
        run: |
          mvn -B -q compile
          mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.7.0:build-classpath \
            -Dmdep.outputFile=target/cp.txt

      - name: 后台启动服务
        run: |
          nohup java -Dfile.encoding=UTF-8 -cp "target/classes:$(cat target/cp.txt)" \
            cn.zjnu.a02.A02Application > target/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              echo "服务已就绪"; exit 0
            fi
            sleep 2
          done
          echo "服务启动超时"; tail -50 target/app.log; exit 1

      - name: 接口契约自检（60 项）
        run: node tools/api-contract.mjs http://127.0.0.1:8080

      - name: RAG 效果评估（Recall@K + 拒答行为）
        run: node tools/rag-eval.mjs http://127.0.0.1:8080

      - name: 失败时归档日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: team-project/target/app.log

  # ---------------------------------------------------------------- 前端与 MCP
  frontend:
    name: 前端（语法 + 图表逻辑）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查
        run: |
          node --check src/main/resources/static/js/charts.js
          node --check src/main/resources/static/js/api.js
          node --check src/main/resources/static/js/app.js

      - name: 图表库逻辑自检（862 项断言）
        run: node tools/charts-test.mjs

  mcp:
    name: MCP Server（语法 + 工具契约）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: python -m py_compile mcp-server/server.py

      - name: 启动后端
        run: |
          mvn -B -q compile
          mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.7.0:build-classpath \
            -Dmdep.outputFile=target/cp.txt
          nohup java -Dfile.encoding=UTF-8 -cp "target/classes:$(cat target/cp.txt)" \
            cn.zjnu.a02.A02Application > target/app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health > /dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: MCP 工具调用契约
        run: |
          python mcp-server/server.py < tools/mcp-requests.jsonl > target/mcp-out.jsonl 2> target/mcp-err.log
          node tools/mcp-verify.mjs target/mcp-out.jsonl

      - name: 失败时归档 MCP 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-logs
          path: |
            team-project/target/mcp-out.jsonl
            team-project/target/mcp-err.log
