server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: a02-career-navigator
  # 默认 profile：H2 内存库，零配置启动（无 Docker / 无 MySQL 也可演示）
  datasource:
    url: jdbc:h2:mem:a02;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    async:
      request-timeout: 120000
  threads:
    virtual:
      enabled: false

# MyBatis（课程实验一：Entity / Mapper / Service / Controller 分层）
# 实体 CRUD 走 MyBatis Mapper；跨表聚合与分析型查询仍走 JdbcTemplate（见 README §7）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cn.zjnu.a02.m1perception.entity,cn.zjnu.a02.m5execution.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    cache-enabled: false

a02:
  # ==========================================================================
  # AI 能力层（v2.0：自建统一模型网关，不再依赖任何指定商业平台）
  # ==========================================================================
  ai:
    # 通道：mock = 本地规则模板（离线可跑、零成本）；openai = OpenAI 兼容协议
    # DeepSeek / 通义千问 / 智谱 / Ollama 都兼容该协议，差异只在 base-url + model
    provider: mock
    # 模型分层（v2.0 §3.4.1）：dev 走本地 Ollama（零费用），standard/demo 走云端
    tier: ${AI_TIER:dev}
    fallback-enabled: true
    max-retry: 2
    temperature:
      path: 0.3          # 路径生成求稳定
      incentive: 0.8     # 激励文案求多样

    # 本机 Ollama（OpenAI 兼容端点）：开发期主力，免费无速率限制
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434/v1}

    # 云端 OpenAI 兼容端点（DeepSeek / 通义 / 智谱 任选其一）
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}

    # 向量化：local = 内置确定性向量（离线可用）；openai = 云端 embedding
    embedding:
      provider: ${EMBEDDING_PROVIDER:local}
      model: ${EMBEDDING_MODEL:text-embedding-v3}

    # NFR-8 限流与费用防护（v2.0 §3.4.2）
    limit:
      global-rpm: 22        # 供应商 30 RPM 时留 25% 余量
      user-rpm: 8
      daily-calls: 1500     # 日调用量硬上限（防调试循环）
      alert-ratio: 0.8      # 用量达 80% 打告警日志
      apply-to-mock: false  # Mock 通道不消耗额度，默认不限流；演练时置 true

    # 二级缓存：相同场景 + 相同上下文直接命中，减少调用次数
    cache:
      enabled: true
      ttl-seconds: 600

    # Mock 行为参数（离线演示用）
    mock:
      chaos: ${MOCK_CHAOS:false}   # true 时首次结构化输出缺字段，演示校验重试
      stream-delay-ms: 18

  # ==========================================================================
  # RAG 自建管线（v2.0 §3.3.2 / FR-7.2）
  # ==========================================================================
  rag:
    chunk:
      size: 400          # 目标块大小（文档要求 300-500 字）
      overlap: 60        # 块间重叠（文档要求 50-80 字）
    top-k: 5
    min-score: 0.12      # 余弦相关度阈值（第一判据）
    min-coverage: 0.3    # 问题实词在片段中的覆盖率阈值（第二判据，防跑题强答）
    auto-ingest: true    # 启动时自动切块 + 向量化

  security:
    jwt:
      # Demo 用固定密钥；生产必须走环境变量（架构文档 §11.2）
      secret: ${JWT_SECRET:a02-demo-secret-key-please-change-in-production-0123456789}
      access-ttl-minutes: 120
    crypto:
      # 敏感字段 AES-GCM 列加密密钥（Demo 固定；生产走环境变量）
      field-key: ${FIELD_AES_KEY:a02-demo-field-key-32bytes-min!!}

  # 仅供自建 MCP Server（P2 可选扩展）调用的只读内部 API 令牌
  internal:
    service-token: ${A02_SERVICE_TOKEN:a02-internal-demo-token}

logging:
  level:
    root: INFO
    cn.zjnu.a02: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"

---
# MySQL 可选 profile（需先创建库：CREATE DATABASE a02 DEFAULT CHARSET utf8mb4;）
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/a02?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      continue-on-error: true
